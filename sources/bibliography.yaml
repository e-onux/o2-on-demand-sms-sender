  - id: source-operator-o2-message-requirement
    title: Operator-provided O2 renewal message and retention requirements
    authors: [Project operator]
    type: user-research
    license: internal
    local_copy: null
    supports: [renew-highspeed-data, retain-recent-sms, execute-manual-modem-actions]
    relevance:
      claim: Exact supported 80-percent and exhausted notifications require one WEITER reply and a new verified baseline; only the newest three SMS messages should remain.
      confidence: high
      limitations:
        - The requirement is conversation-derived and has not been independently archived or validated against an O2 public document.
        - O2 may change message wording, sender details, service number or renewal policy.
    last_verified: 2026-08-02
    next_review: 2026-11-02
